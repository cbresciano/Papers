<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claudio Bresciano - Research Papers</title>
    <style>
        body { 
            font-family: monospace; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            color: #333; 
        }
        h1 { 
            border-bottom: 2px solid #333; 
            padding-bottom: 10px; 
        }
        .paper-item { 
            margin-bottom: 20px; 
            padding: 10px 0; 
            border-bottom: 1px dashed #ccc; 
        }
        .paper-title { 
            font-weight: bold; 
            font-size: 1.1em; 
            text-decoration: none; 
            color: #0066cc; 
        }
        .paper-title:hover { 
            text-decoration: underline; 
        }
        .meta { 
            font-size: 0.9em; 
            color: #666; 
            margin-top: 5px; 
        }
    </style>
</head>
<body>

    <h1>Corpus of Research - TNA Framework</h1>
    <div id="papers-container">Cargando trayectoria de documentos...</div>

    <script>
        // Configuración de tu origen en GitHub
        const USER = "cbresciano"; 
        const REPO = "Papers";            
        const PATH = "";                  

        const API_URL = `https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`;

        async function fetchPapers() {
            const container = document.getElementById('papers-container');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Fallo en el cierre de la API');
                
                const files = await response.json();
                
                // Filtrar solo los archivos PDF de la raíz
                const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));

                if (pdfFiles.length === 0) {
                    container.innerHTML = "No se encontraron archivos PDF en la raíz del repositorio.";
                    return;
                }

                container.innerHTML = ''; 

                pdfFiles.forEach(file => {
                    // Limpiar el nombre del archivo físico para mostrarlo como título
                    const title = file.name.replace(/\.pdf$/i, '').replace(/_/g, ' ').replace(/-/g, ' ');
                    
                    // Construcción de la URL de visualización web directa a través del visor de Google Pages
                    const pdfUrl = `https://${USER}.github.io/${REPO}/${file.name}`;
                    const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(pdfUrl)}&embedded=true`;
                    
                    const paperHtml = `
                        <div class="paper-item">
                            <a class="paper-title" href="${viewerUrl}" target="_blank">${title}</a>
                            <div class="meta">Archivo: ${file.name} | Tamaño: ${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                        </div>
                    `;
                    container.innerHTML += paperHtml;
                });

            } catch (error) {
                container.innerHTML = `Error en la lectura del soporte local: ${error.message}`;
            }
        }

        fetchPapers();
    </script>
</body>
</html>
