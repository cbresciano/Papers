<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Claudio Bresciano - Research Papers</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .paper-item { margin-bottom: 15px; padding: 5px 0; border-bottom: 1px dashed #ccc; }
        .paper-title { font-weight: bold; color: #0066cc; text-decoration: none; }
        .paper-title:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Corpus of Research - TNA Framework</h1>
    <div id="list">Cargando...</div>

    <script>
        const USER = "cbresciano", REPO = "Papers";
        fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`)
            .then(res => res.json())
            .then(files => {
                const pdfs = files.filter(f => f.name.endsWith('.pdf'));
                document.getElementById('list').innerHTML = pdfs.map(f => `
                    <div class="paper-item">
                        <a class="paper-title" href="https://${USER}.github.io/${REPO}/${f.name}" target="_blank">
                            ${f.name.replace(/\.pdf$/i, '').replace(/_/g, ' ').replace(/-/g, ' ')}
                        </a>
                    </div>
                `).join('');
            })
            .catch(() => document.getElementById('list').innerText = "Error al cargar el soporte local.");
    </script>
</body>
</html>
